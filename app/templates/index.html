<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo DevOps Lab</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a2332;
        --text: #e7ecf3;
        --muted: #8b9bb4;
        --accent: #3d9cf0;
        --done: #5b6b7f;
        --danger: #e85d5d;
        --border: #2a3548;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 20% 0%, #1a2a44 0%, transparent 55%),
          var(--bg);
        color: var(--text);
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
      }
      .sub {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0 0 1.75rem;
      }
      form.add {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      input[type="text"] {
        flex: 1;
        padding: 0.7rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font-size: 1rem;
      }
      input[type="text"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 0.7rem 1rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #061018;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 0.35rem 0.65rem;
        font-size: 0.8rem;
      }
      button.danger {
        color: var(--danger);
        border-color: #5a3030;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.85rem 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      li.done .title {
        text-decoration: line-through;
        color: var(--done);
      }
      .title {
        flex: 1;
        word-break: break-word;
      }
      .actions {
        display: flex;
        gap: 0.35rem;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 2rem 1rem;
        border: 1px dashed var(--border);
        border-radius: 10px;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      footer code {
        background: var(--panel);
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todo DevOps Lab</h1>
      <p class="sub">Step 0 — app only. No Docker, CI, or cloud yet.</p>

      <form class="add" method="post" action="/todos">
        <input
          type="text"
          name="title"
          placeholder="What needs doing?"
          maxlength="200"
          required
          autofocus
        />
        <button class="primary" type="submit">Add</button>
      </form>

      {% if todos %}
      <ul>
        {% for todo in todos %}
        <li class="{% if todo.done %}done{% endif %}">
          <span class="title">{{ todo.title }}</span>
          <div class="actions">
            <form method="post" action="/todos/{{ todo.id }}/toggle">
              <button class="ghost" type="submit">
                {% if todo.done %}Undo{% else %}Done{% endif %}
              </button>
            </form>
            <form method="post" action="/todos/{{ todo.id }}/delete">
              <button class="ghost danger" type="submit">Delete</button>
            </form>
          </div>
        </li>
        {% endfor %}
      </ul>
      {% else %}
      <p class="empty">No todos yet. Add one above.</p>
      {% endif %}

      <footer>
        Health check: <code>GET /health</code> →
        <a href="/health" style="color: var(--accent)">/health</a>
      </footer>
    </main>
  </body>
</html>
